<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Выдыхай · Клиенты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --paper:#ECEEFB; --card:#FFFFFF; --ink:#141224; --muted:#565472; --line:#C9CBE4;
  --hot:#FF4D2E; --cobalt:#3346FF; --lemon:#FFE040; --mint:#62D9B4; --on-bright:#141224;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#121120; --card:#1D1B30; --ink:#EFEEFA; --muted:#A9A6C4; --line:#38355A;
  --hot:#FF6A4D; --cobalt:#6F7EFF; color-scheme:dark }}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body)}
[hidden]{display:none!important}
.wrap{max-width:1480px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
h1{font:900 26px/1.1 var(--display);margin:0}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.btn{font:700 15px/1 var(--body);padding:12px 18px;border:3px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn-hot{background:var(--hot);color:var(--on-bright)}
.btn:disabled{opacity:.6;cursor:default}
input,textarea,select{font:500 15px/1.4 var(--body);padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:80px}

.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:28px;display:grid;gap:16px}
.login label{font-weight:700}
.login input{font-size:16px;padding:12px 14px;border-width:3px;border-radius:12px}
.msg{font-weight:700;padding:10px 14px;border-radius:12px;background:var(--lemon);color:var(--on-bright);border:2px solid var(--ink)}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.updated{font:500 12px/1 var(--mono);color:var(--muted)}
#panel-msg{margin-bottom:16px}

/* Доска: колонки по этапам; на узком экране прокручивается вбок только сама доска */
.board{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:14px;overflow-x:auto;padding:4px 4px 14px;scroll-snap-type:x proximity}
.col{background:var(--card);border:2px solid var(--ink);border-top-width:8px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:240px;scroll-snap-align:start}
.col.over{outline:3px dashed var(--cobalt);outline-offset:3px}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0;font:800 15px/1.25 var(--body)}
.col-head b{font:700 13px/1 var(--mono);padding:4px 8px;border:2px solid var(--ink);border-radius:999px}
[data-stage="Новая"]{border-top-color:var(--hot)}
[data-stage="Связались"]{border-top-color:var(--lemon)}
[data-stage="Записан на консультацию"]{border-top-color:var(--cobalt)}
[data-stage="Консультация проведена"]{border-top-color:var(--mint)}
[data-stage="Отказ"]{border-top-color:var(--muted)}
.cards{display:grid;gap:10px;align-content:start}
.empty{padding:18px 10px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px;font-size:14px}

.card{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px;display:grid;gap:6px;cursor:grab;min-width:0}
.card.dragging{opacity:.4}
.card-name{all:unset;font:800 16px/1.3 var(--body);cursor:pointer;overflow-wrap:anywhere}
.card-name:hover{text-decoration:underline}
.card-name:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:4px}
.card-phone{font:700 14px/1.3 var(--mono);color:inherit;overflow-wrap:anywhere}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font:500 12px/1.4 var(--mono);color:var(--muted)}
.src{font:700 11px/1 var(--mono);padding:4px 7px;border:2px solid var(--ink);border-radius:999px;color:var(--ink)}
.src[data-src="Вручную"]{background:var(--lemon);color:var(--on-bright)}
.stage{font:600 13px/1.2 var(--body);padding:8px;background:var(--card);cursor:pointer}

/* Окна */
dialog{border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);background:var(--card);color:var(--ink);padding:0;width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(20,18,36,.55)}
.dlg{padding:22px;display:grid;gap:10px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg h2{font:900 20px/1.25 var(--display);margin:0;overflow-wrap:anywhere}
.dlg h3{font:800 15px/1.3 var(--body);margin:14px 0 0}
.x{flex:none;font:700 22px/1 var(--body);width:40px;height:40px;border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.lbl{font-weight:700;margin-top:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.saved{font:700 13px/1 var(--mono);color:var(--muted)}
.muted{color:var(--muted)}
.info{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.info a{color:inherit;font-family:var(--mono)}
.history{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--line);display:grid;gap:10px}
.history time{display:block;font:500 12px/1.4 var(--mono);color:var(--muted)}
.history span{font-weight:700}
.history small{display:block;color:var(--muted)}
@media (max-width:480px){.info{grid-template-columns:1fr;gap:0}.info dd{margin-bottom:8px}}
</style>
</head>
<body>
<div class="wrap">
  <form class="login" id="login" hidden>
    <h1>Вход</h1>
    <label for="pw">Пароль администратора</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-hot" type="submit" id="login-btn">Войти</button>
    <div class="msg" id="login-msg" role="alert" hidden></div>
  </form>

  <div id="panel" hidden>
    <div class="bar">
      <h1>Клиенты</h1>
      <div class="tools">
        <span class="updated" id="updated"></span>
        <button class="btn btn-hot" type="button" id="add">Добавить клиента</button>
        <button class="btn" type="button" id="refresh">Обновить</button>
        <button class="btn" type="button" id="logout">Выйти</button>
      </div>
    </div>
    <div class="msg" id="panel-msg" role="alert" hidden></div>
    <div class="board" id="board" aria-label="Воронка клиентов"></div>
  </div>
</div>

<!-- Карточка клиента -->
<dialog id="card-dlg" aria-labelledby="d-title">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="d-title"></h2>
      <button class="x" type="button" data-close aria-label="Закрыть">×</button>
    </div>
    <div class="msg" id="d-msg" role="alert" hidden></div>
    <div class="dlg" id="d-content" style="padding:0">
      <dl class="info" id="d-info"></dl>
      <label class="lbl" for="d-stage">Этап</label>
      <select id="d-stage" class="stage"></select>
      <label class="lbl" for="d-notes">Заметки</label>
      <textarea id="d-notes" rows="4" maxlength="2000"></textarea>
      <div class="row">
        <button class="btn" type="button" id="d-save">Сохранить заметки</button>
        <span class="saved" id="d-saved" role="status"></span>
      </div>
      <h3>История этапов</h3>
      <ol class="history" id="d-history"></ol>
    </div>
  </div>
</dialog>

<!-- Новый клиент -->
<dialog id="add-dlg" aria-labelledby="a-title">
  <form class="dlg" id="add-form" novalidate>
    <div class="dlg-head">
      <h2 id="a-title">Новый клиент</h2>
      <button class="x" type="button" data-close aria-label="Закрыть">×</button>
    </div>
    <label class="lbl" for="a-name">Имя</label>
    <input id="a-name" maxlength="80" autocomplete="off">
    <label class="lbl" for="a-phone">Телефон</label>
    <input id="a-phone" type="tel" maxlength="40" autocomplete="off">
    <label class="lbl" for="a-notes">Заметка</label>
    <textarea id="a-notes" rows="3" maxlength="2000"></textarea>
    <div class="msg" id="a-msg" role="alert" hidden></div>
    <div class="row"><button class="btn btn-hot" type="submit" id="a-save">Добавить</button></div>
  </form>
</dialog>

<script>
(function(){
  // Этапы воронки. Тот же список — в api/_lib.js и в check-ограничении supabase.sql
  var STATUSES = ["Новая", "Связались", "Записан на консультацию", "Консультация проведена", "Отказ"];
  var $ = function(id){ return document.getElementById(id); };
  var token = null, leads = [], current = null; // current — id клиента в открытой карточке
  try { token = sessionStorage.getItem("vydyhai_token"); } catch(e){}

  function saveToken(t){ token = t; try { t ? sessionStorage.setItem("vydyhai_token", t) : sessionStorage.removeItem("vydyhai_token"); } catch(e){} }
  function closeDialogs(){ ["card-dlg", "add-dlg"].forEach(function(id){ if ($(id).open) $(id).close(); }); }
  function showLogin(text){
    saveToken(null); closeDialogs();
    $("panel").hidden = true; $("login").hidden = false;
    $("login-msg").hidden = !text; $("login-msg").textContent = text || "";
    $("pw").focus();
  }
  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({"Content-Type":"application/json", "Authorization":"Bearer " + token}, opts.headers || {});
    return fetch(path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(data){
        if (r.status === 401) { showLogin("Сессия закончилась, войдите снова."); throw new Error("unauthorized"); }
        if (!r.ok) throw new Error(data.error || "Ошибка " + r.status);
        return data;
      });
    });
  }
  function setStage(id, status){ return api("/api/leads", {method:"PATCH", body: JSON.stringify({id:id, status:status})}); }

  // Дата с часами и минутами по Кишинёву — как в уведомлении Telegram о заявке
  function fmt(iso){
    return new Date(iso).toLocaleString("ru-RU", {timeZone:"Europe/Chisinau", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
  }
  function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function tel(phone){ return "tel:" + phone.replace(/[^\d+]/g, ""); }
  function msg(id, text){ $(id).hidden = !text; $(id).textContent = text || ""; }
  function find(id){ for (var i = 0; i < leads.length; i++) if (leads[i].id === id) return leads[i]; return null; }
  function fillStages(sel, value){
    sel.textContent = "";
    STATUSES.forEach(function(s){ var o = el("option", null, s); o.value = s; if (s === value) o.selected = true; sel.appendChild(o); });
  }

  // ---------- Доска ----------
  function renderBoard(){
    var board = $("board"); board.textContent = "";
    STATUSES.forEach(function(stage){
      var items = leads.filter(function(l){ return l.status === stage; });
      var col = el("section", "col"); col.dataset.stage = stage;
      col.setAttribute("aria-label", stage + ": " + items.length);
      var head = el("h2", "col-head"); head.appendChild(el("span", null, stage)); head.appendChild(el("b", null, String(items.length)));
      var list = el("div", "cards");
      if (!items.length) list.appendChild(el("div", "empty", stage === "Новая" ? "Пусто. Заявки с сайта появятся здесь." : "Пусто"));
      items.forEach(function(l){ list.appendChild(renderCard(l)); });
      col.appendChild(head); col.appendChild(list);

      // Перетаскивание карточки мышью в другую колонку
      col.addEventListener("dragover", function(e){ e.preventDefault(); col.classList.add("over"); });
      col.addEventListener("dragleave", function(e){ if (!col.contains(e.relatedTarget)) col.classList.remove("over"); });
      col.addEventListener("drop", function(e){
        e.preventDefault(); col.classList.remove("over");
        var lead = find(Number(e.dataTransfer.getData("text/plain")));
        if (lead && lead.status !== stage) move(lead, stage);
      });
      board.appendChild(col);
    });
  }

  function renderCard(l){
    var card = el("article", "card"); card.draggable = true;
    card.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(l.id)); e.dataTransfer.effectAllowed = "move"; card.classList.add("dragging"); });
    card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
    card.addEventListener("click", function(e){ if (!e.target.closest("a,select,button")) openCard(l.id); });

    var name = el("button", "card-name", l.name); name.type = "button";
    name.addEventListener("click", function(){ openCard(l.id); });
    var phone = el("a", "card-phone", l.phone); phone.href = tel(l.phone);
    var meta = el("div", "card-meta");
    var src = el("span", "src", l.source); src.dataset.src = l.source;
    meta.appendChild(src);
    meta.appendChild(el("span", null, "#" + l.id + " · " + fmt(l.created_at)));
    var sel = el("select", "stage"); sel.setAttribute("aria-label", "Этап: " + l.name);
    fillStages(sel, l.status);
    sel.addEventListener("change", function(){ sel.disabled = true; move(l, sel.value); });

    card.appendChild(name); card.appendChild(phone); card.appendChild(meta); card.appendChild(sel);
    return card;
  }

  function move(lead, stage){
    msg("panel-msg", "");
    setStage(lead.id, stage).then(load).catch(function(e){
      if (e.message !== "unauthorized") { msg("panel-msg", e.message); renderBoard(); }
    });
  }

  function load(){
    return api("/api/leads").then(function(data){
      leads = data; renderBoard();
      $("updated").textContent = "обновлено " + new Date().toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
    }).catch(function(e){ if (e.message !== "unauthorized") msg("panel-msg", e.message); });
  }

  // ---------- Карточка клиента ----------
  function openCard(id){
    current = id;
    msg("d-msg", ""); $("d-content").hidden = true; $("d-title").textContent = "Загружаю…";
    if (!$("card-dlg").open) $("card-dlg").showModal();
    loadCard(id, true).catch(function(e){ if (e.message !== "unauthorized") msg("d-msg", e.message); });
  }

  // withNotes = false — не трогать заметки, чтобы не стереть несохранённый текст при смене этапа
  function loadCard(id, withNotes){
    return api("/api/leads?id=" + id).then(function(lead){
      if (current !== id) return;
      renderDetail(lead, withNotes);
      $("d-content").hidden = false;
    });
  }

  function renderDetail(lead, withNotes){
    $("d-title").textContent = lead.name;
    var info = $("d-info"); info.textContent = "";
    function row(k, v, href){
      info.appendChild(el("dt", null, k));
      var dd = el("dd");
      if (href) { var a = el("a", null, v); a.href = href; dd.appendChild(a); } else dd.textContent = v;
      info.appendChild(dd);
    }
    row("Телефон", lead.phone, tel(lead.phone));
    row("Источник", lead.source);
    row("Создан", fmt(lead.created_at));
    if (lead.age) row("Возраст", String(lead.age));
    if (lead.topic) row("Тема", lead.topic);
    if (lead.comment) row("Комментарий с сайта", lead.comment);

    fillStages($("d-stage"), lead.status);
    if (withNotes) { $("d-notes").value = lead.notes || ""; $("d-saved").textContent = ""; }

    var h = $("d-history"); h.textContent = "";
    if (!lead.history.length) h.appendChild(el("li", "muted", "Записей нет"));
    lead.history.forEach(function(x){
      var li = el("li");
      li.appendChild(el("time", null, fmt(x.changed_at)));
      li.appendChild(el("span", null, x.from_stage ? x.from_stage + " → " + x.to_stage : "Создан · " + x.to_stage));
      if (x.note) li.appendChild(el("small", null, x.note));
      h.appendChild(li);
    });
  }

  $("d-stage").addEventListener("change", function(){
    var sel = this, id = current; sel.disabled = true; msg("d-msg", "");
    setStage(id, sel.value)
      .then(function(){ load(); })
      .catch(function(e){ if (e.message !== "unauthorized") msg("d-msg", e.message); })
      .then(function(){ if (current === id) return loadCard(id, false); })
      .catch(function(){})
      .then(function(){ sel.disabled = false; });
  });

  $("d-save").addEventListener("click", function(){
    var btn = this, id = current; btn.disabled = true; msg("d-msg", ""); $("d-saved").textContent = "";
    api("/api/leads", {method:"PATCH", body: JSON.stringify({id:id, notes:$("d-notes").value})})
      .then(function(){ $("d-saved").textContent = "Сохранено"; load(); })
      .catch(function(e){ if (e.message !== "unauthorized") msg("d-msg", e.message); })
      .then(function(){ btn.disabled = false; });
  });

  $("card-dlg").addEventListener("close", function(){ current = null; });

  // ---------- Новый клиент ----------
  $("add").addEventListener("click", function(){
    $("add-form").reset(); msg("a-msg", "");
    $("add-dlg").showModal(); $("a-name").focus();
  });

  $("add-form").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("a-name").value.trim(), phone = $("a-phone").value.trim();
    var err = !name ? "Укажите имя клиента."
      : phone.replace(/\D/g, "").length < 6 ? "Проверьте номер телефона: в нём должно быть хотя бы 6 цифр." : "";
    if (err) { msg("a-msg", err); return; }
    var btn = $("a-save"); btn.disabled = true; msg("a-msg", "");
    api("/api/leads", {method:"POST", body: JSON.stringify({name:name, phone:phone, notes:$("a-notes").value})})
      .then(function(){ $("add-dlg").close(); load(); })
      .catch(function(e){ if (e.message !== "unauthorized") msg("a-msg", e.message); })
      .then(function(){ btn.disabled = false; });
  });

  document.querySelectorAll("[data-close]").forEach(function(b){
    b.addEventListener("click", function(){ b.closest("dialog").close(); });
  });

  // ---------- Вход ----------
  function openPanel(){ $("login").hidden = true; $("panel").hidden = false; load(); }

  $("login").addEventListener("submit", function(e){
    e.preventDefault();
    var btn = $("login-btn"); btn.disabled = true; $("login-msg").hidden = true;
    fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password: $("pw").value})})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if (!r.ok) throw new Error(d.error || "Не удалось войти"); return d; }); })
      .then(function(d){ saveToken(d.token); $("pw").value = ""; openPanel(); })
      .catch(function(err){ $("login-msg").textContent = err.message; $("login-msg").hidden = false; })
      .then(function(){ btn.disabled = false; });
  });
  $("logout").addEventListener("click", function(){ showLogin(""); });
  $("refresh").addEventListener("click", function(){ msg("panel-msg", ""); load(); });

  token ? openPanel() : showLogin("");
})();
</script>
</body>
</html>
