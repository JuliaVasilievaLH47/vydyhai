<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Выдыхай · Админка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --paper:#ECEEFB; --card:#FFFFFF; --ink:#141224; --muted:#565472; --line:#C9CBE4;
  --hot:#FF4D2E; --cobalt:#3346FF; --lemon:#FFE040; --mint:#62D9B4; --on-bright:#141224;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#121120; --card:#1D1B30; --ink:#EFEEFA; --muted:#A9A6C4; --line:#38355A;
  --hot:#FF6A4D; --cobalt:#6F7EFF; color-scheme:dark }}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body)}
[hidden]{display:none!important}
.wrap{max-width:1480px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
h1{font:900 26px/1.1 var(--display);margin:0}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.btn{font:700 15px/1 var(--body);padding:12px 18px;border:3px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn-hot{background:var(--hot);color:var(--on-bright)}
.btn:disabled{opacity:.6;cursor:default}
input,textarea,select{font:500 15px/1.4 var(--body);padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:80px}

.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:28px;display:grid;gap:16px}
.login label{font-weight:700}
.login input{font-size:16px;padding:12px 14px;border-width:3px;border-radius:12px}
.msg{font-weight:700;padding:10px 14px;border-radius:12px;background:var(--lemon);color:var(--on-bright);border:2px solid var(--ink)}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.updated{font:500 12px/1 var(--mono);color:var(--muted)}
#panel-msg{margin-bottom:16px}

/* Доска: колонки по этапам; на узком экране прокручивается вбок только сама доска */
.board{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:14px;overflow-x:auto;padding:4px 4px 14px;scroll-snap-type:x proximity}
.col{background:var(--card);border:2px solid var(--ink);border-top-width:8px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:240px;scroll-snap-align:start}
.col.over{outline:3px dashed var(--cobalt);outline-offset:3px}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0;font:800 15px/1.25 var(--body)}
.col-head b{font:700 13px/1 var(--mono);padding:4px 8px;border:2px solid var(--ink);border-radius:999px}
[data-stage="Новая"]{border-top-color:var(--hot)}
[data-stage="Связались"]{border-top-color:var(--lemon)}
[data-stage="Записан на консультацию"]{border-top-color:var(--cobalt)}
[data-stage="Консультация проведена"]{border-top-color:var(--mint)}
[data-stage="Отказ"]{border-top-color:var(--muted)}
.cards{display:grid;gap:10px;align-content:start}
.empty{padding:18px 10px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px;font-size:14px}

.card{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px;display:grid;gap:6px;cursor:grab;min-width:0}
.card.dragging{opacity:.4}
.card-name{all:unset;font:800 16px/1.3 var(--body);cursor:pointer;overflow-wrap:anywhere}
.card-name:hover{text-decoration:underline}
.card-name:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:4px}
.card-phone{font:700 14px/1.3 var(--mono);color:inherit;overflow-wrap:anywhere}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font:500 12px/1.4 var(--mono);color:var(--muted)}
.src{font:700 11px/1 var(--mono);padding:4px 7px;border:2px solid var(--ink);border-radius:999px;color:var(--ink)}
.src[data-src="Вручную"]{background:var(--lemon);color:var(--on-bright)}
.src[data-src="Telegram"]{background:var(--mint);color:var(--on-bright)}
.card-when{font:700 13px/1.3 var(--mono);padding:6px 8px;border:2px dashed var(--ink);border-radius:8px;justify-self:start}
.stage{font:600 13px/1.2 var(--body);padding:8px;background:var(--card);cursor:pointer}

/* Окна */
dialog{border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);background:var(--card);color:var(--ink);padding:0;width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(20,18,36,.55)}
.dlg{padding:22px;display:grid;gap:10px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg h2{font:900 20px/1.25 var(--display);margin:0;overflow-wrap:anywhere}
.dlg h3{font:800 15px/1.3 var(--body);margin:14px 0 0}
.x{flex:none;font:700 22px/1 var(--body);width:40px;height:40px;border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.lbl{font-weight:700;margin-top:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.saved{font:700 13px/1 var(--mono);color:var(--muted)}
.muted{color:var(--muted)}
.info{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.info a{color:inherit;font-family:var(--mono)}
.history{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--line);display:grid;gap:10px}
.history time{display:block;font:500 12px/1.4 var(--mono);color:var(--muted)}
.history span{font-weight:700}
.history small{display:block;color:var(--muted)}
@media (max-width:480px){.info{grid-template-columns:1fr;gap:0}.info dd{margin-bottom:8px}}

/* Вкладки */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:800 15px/1 var(--body);padding:11px 18px;border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.btn-sm{font-size:13px;padding:8px 12px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}

/* Расходы */
.month{display:flex;align-items:center;gap:8px}
.month b{font:800 16px/1.2 var(--body);min-width:150px;text-align:center}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px}
.total-card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.total-card h2{font:800 15px/1.3 var(--body);margin:0 0 4px}
.trow{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.trow span:last-child{font:700 14px/1.4 var(--mono);white-space:nowrap}
.trow.sum{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font-weight:800;font-size:15px}
.trow.sum span:last-child{font-size:17px}
.exp-list{display:grid;gap:10px}
.exp{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:100px minmax(0,1fr) auto auto;gap:12px;align-items:center}
.exp-date{font:500 13px/1.3 var(--mono);color:var(--muted)}
.exp-main{display:grid;gap:4px;justify-items:start;min-width:0}
.exp-vendor{font-weight:700;overflow-wrap:anywhere}
.exp-amount{font:700 15px/1.3 var(--mono);white-space:nowrap}
@media (max-width:640px){.exp{grid-template-columns:minmax(0,1fr) auto}.exp-date{grid-column:1/-1}}

/* Экран проверки чека */
#exp-dlg{width:min(920px,calc(100vw - 32px))}
.review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.preview{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);display:grid;gap:8px;justify-items:center;min-height:200px;padding:8px}
.preview img{display:block;max-width:100%;max-height:65vh;object-fit:contain}
.preview iframe{width:100%;height:65vh;border:0;background:#fff}
.fields{display:grid;gap:6px;min-width:0}
.fields fieldset{border:0;padding:0;margin:0;min-width:0;display:grid;gap:6px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.two > div{display:grid;gap:6px}
.status{margin:0;font-weight:700;color:var(--muted)}
@media (max-width:700px){.review{grid-template-columns:1fr}.preview img{max-height:40vh}.preview iframe{height:40vh}}
</style>
</head>
<body>
<div class="wrap">
  <form class="login" id="login" hidden>
    <h1>Вход</h1>
    <label for="pw">Пароль администратора</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-hot" type="submit" id="login-btn">Войти</button>
    <div class="msg" id="login-msg" role="alert" hidden></div>
  </form>

  <div id="panel" hidden>
    <div class="bar">
      <nav class="tabs" role="tablist" aria-label="Разделы админки">
        <button type="button" role="tab" id="tab-clients" aria-controls="clients-view" aria-selected="true">Клиенты</button>
        <button type="button" role="tab" id="tab-expenses" aria-controls="expenses-view" aria-selected="false">Расходы</button>
      </nav>
      <div class="tools">
        <span class="updated" id="updated"></span>
        <button class="btn" type="button" id="refresh">Обновить</button>
        <button class="btn" type="button" id="logout">Выйти</button>
      </div>
    </div>
    <div class="msg" id="panel-msg" role="alert" hidden></div>

    <section id="clients-view" role="tabpanel" aria-labelledby="tab-clients">
      <div class="bar">
        <h1>Клиенты</h1>
        <button class="btn btn-hot" type="button" id="add">Добавить клиента</button>
      </div>
      <div class="board" id="board" aria-label="Воронка клиентов"></div>
    </section>

    <section id="expenses-view" role="tabpanel" aria-labelledby="tab-expenses" hidden>
      <div class="bar">
        <h1>Расходы</h1>
        <div class="tools">
          <div class="month">
            <button class="x" type="button" id="m-prev" aria-label="Предыдущий месяц">‹</button>
            <b id="m-label" aria-live="polite"></b>
            <button class="x" type="button" id="m-next" aria-label="Следующий месяц">›</button>
          </div>
          <button class="btn btn-hot" type="button" id="exp-add">Добавить чек</button>
          <!-- Без capture: телефон сам предложит камеру, галерею или файлы -->
          <input class="vh" type="file" id="exp-file" accept="image/*,application/pdf" tabindex="-1" aria-hidden="true">
        </div>
      </div>
      <div class="totals" id="exp-totals"></div>
      <div class="exp-list" id="exp-list"></div>
    </section>
  </div>
</div>

<!-- Экран проверки распознанного чека -->
<dialog id="exp-dlg" aria-labelledby="e-title">
  <form class="dlg" id="exp-form" novalidate>
    <div class="dlg-head">
      <h2 id="e-title">Проверьте чек</h2>
      <button class="x" type="button" data-close aria-label="Закрыть">×</button>
    </div>
    <div class="review">
      <div class="preview" id="e-preview"></div>
      <div class="fields">
        <p class="status" id="e-status" role="status"></p>
        <div class="msg" id="e-msg" role="alert" hidden></div>
        <fieldset id="e-fields" disabled>
          <div class="two">
            <div><label class="lbl" for="e-amount">Сумма</label><input id="e-amount" inputmode="decimal" autocomplete="off"></div>
            <div><label class="lbl" for="e-currency">Валюта</label><input id="e-currency" maxlength="3" autocomplete="off" style="text-transform:uppercase"></div>
          </div>
          <label class="lbl" for="e-date">Дата</label>
          <input id="e-date" type="date">
          <label class="lbl" for="e-vendor">Продавец</label>
          <input id="e-vendor" maxlength="120" autocomplete="off">
          <label class="lbl" for="e-category">Категория</label>
          <select id="e-category"></select>
        </fieldset>
        <div class="row" style="margin-top:10px">
          <button class="btn btn-hot" type="submit" id="e-save" disabled>Сохранить</button>
          <button class="btn" type="button" data-close>Отмена</button>
        </div>
      </div>
    </div>
  </form>
</dialog>

<!-- Карточка клиента -->
<dialog id="card-dlg" aria-labelledby="d-title">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="d-title"></h2>
      <button class="x" type="button" data-close aria-label="Закрыть">×</button>
    </div>
    <div class="msg" id="d-msg" role="alert" hidden></div>
    <div class="dlg" id="d-content" style="padding:0">
      <dl class="info" id="d-info"></dl>
      <label class="lbl" for="d-stage">Этап</label>
      <select id="d-stage" class="stage"></select>
      <label class="lbl" for="d-notes">Заметки</label>
      <textarea id="d-notes" rows="4" maxlength="2000"></textarea>
      <div class="row">
        <button class="btn" type="button" id="d-save">Сохранить заметки</button>
        <span class="saved" id="d-saved" role="status"></span>
      </div>
      <h3>История этапов</h3>
      <ol class="history" id="d-history"></ol>
    </div>
  </div>
</dialog>

<!-- Новый клиент -->
<dialog id="add-dlg" aria-labelledby="a-title">
  <form class="dlg" id="add-form" novalidate>
    <div class="dlg-head">
      <h2 id="a-title">Новый клиент</h2>
      <button class="x" type="button" data-close aria-label="Закрыть">×</button>
    </div>
    <label class="lbl" for="a-name">Имя</label>
    <input id="a-name" maxlength="80" autocomplete="off">
    <label class="lbl" for="a-phone">Телефон</label>
    <input id="a-phone" type="tel" maxlength="40" autocomplete="off">
    <label class="lbl" for="a-notes">Заметка</label>
    <textarea id="a-notes" rows="3" maxlength="2000"></textarea>
    <div class="msg" id="a-msg" role="alert" hidden></div>
    <div class="row"><button class="btn btn-hot" type="submit" id="a-save">Добавить</button></div>
  </form>
</dialog>

<script>
(function(){
  // Этапы воронки. Тот же список — в api/_lib.js и в check-ограничении supabase.sql
  var STATUSES = ["Новая", "Связались", "Записан на консультацию", "Консультация проведена", "Отказ"];
  var $ = function(id){ return document.getElementById(id); };
  var token = null, leads = [], current = null; // current — id клиента в открытой карточке
  try { token = sessionStorage.getItem("vydyhai_token"); } catch(e){}

  function saveToken(t){ token = t; try { t ? sessionStorage.setItem("vydyhai_token", t) : sessionStorage.removeItem("vydyhai_token"); } catch(e){} }
  function closeDialogs(){ ["card-dlg", "add-dlg", "exp-dlg"].forEach(function(id){ if ($(id).open) $(id).close(); }); }
  function showLogin(text){
    saveToken(null); closeDialogs();
    $("panel").hidden = true; $("login").hidden = false;
    $("login-msg").hidden = !text; $("login-msg").textContent = text || "";
    $("pw").focus();
  }
  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({"Content-Type":"application/json", "Authorization":"Bearer " + token}, opts.headers || {});
    return fetch(path, opts).catch(function(){
      throw new Error("Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.");
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(data){
        if (r.status === 401) { showLogin("Сессия закончилась, войдите снова."); throw new Error("unauthorized"); }
        if (!r.ok) throw new Error(data.error || HTTP_ERRORS[r.status] || "Ошибка " + r.status);
        return data;
      });
    });
  }
  // Ответы самого Vercel (не наших функций) приходят без JSON — переводим их на понятный язык
  var HTTP_ERRORS = {
    413: "Файл слишком большой для отправки. Выберите файл поменьше.",
    504: "Сервер не дождался ответа. Попробуйте позже."
  };
  function stamp(){ $("updated").textContent = "обновлено " + new Date().toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"}); }
  function setStage(id, status){ return api("/api/leads", {method:"PATCH", body: JSON.stringify({id:id, status:status})}); }

  // Дата с часами и минутами по Кишинёву — как в уведомлении Telegram о заявке
  function fmt(iso){
    return new Date(iso).toLocaleString("ru-RU", {timeZone:"Europe/Chisinau", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
  }
  function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function tel(phone){ return "tel:" + phone.replace(/[^\d+]/g, ""); }
  function tgUrl(username){ return "https://t.me/" + encodeURIComponent(username); }
  // Как связаться: телефон, иначе Telegram (у записей из Mini App телефон необязателен)
  function contactLink(l, cls){
    var a;
    if (l.phone) { a = el("a", cls, l.phone); a.href = tel(l.phone); return a; }
    if (l.telegram_username) { a = el("a", cls, "@" + l.telegram_username); a.href = tgUrl(l.telegram_username); a.target = "_blank"; a.rel = "noopener"; return a; }
    return el("span", cls + " muted", "без телефона");
  }
  function msg(id, text){ $(id).hidden = !text; $(id).textContent = text || ""; }
  function find(id){ for (var i = 0; i < leads.length; i++) if (leads[i].id === id) return leads[i]; return null; }
  function fillStages(sel, value){
    sel.textContent = "";
    STATUSES.forEach(function(s){ var o = el("option", null, s); o.value = s; if (s === value) o.selected = true; sel.appendChild(o); });
  }

  // ---------- Доска ----------
  function renderBoard(){
    var board = $("board"); board.textContent = "";
    STATUSES.forEach(function(stage){
      var items = leads.filter(function(l){ return l.status === stage; });
      var col = el("section", "col"); col.dataset.stage = stage;
      col.setAttribute("aria-label", stage + ": " + items.length);
      var head = el("h2", "col-head"); head.appendChild(el("span", null, stage)); head.appendChild(el("b", null, String(items.length)));
      var list = el("div", "cards");
      if (!items.length) list.appendChild(el("div", "empty", stage === "Новая" ? "Пусто. Заявки с сайта появятся здесь." : "Пусто"));
      items.forEach(function(l){ list.appendChild(renderCard(l)); });
      col.appendChild(head); col.appendChild(list);

      // Перетаскивание карточки мышью в другую колонку
      col.addEventListener("dragover", function(e){ e.preventDefault(); col.classList.add("over"); });
      col.addEventListener("dragleave", function(e){ if (!col.contains(e.relatedTarget)) col.classList.remove("over"); });
      col.addEventListener("drop", function(e){
        e.preventDefault(); col.classList.remove("over");
        var lead = find(Number(e.dataTransfer.getData("text/plain")));
        if (lead && lead.status !== stage) move(lead, stage);
      });
      board.appendChild(col);
    });
  }

  function renderCard(l){
    var card = el("article", "card"); card.draggable = true;
    card.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(l.id)); e.dataTransfer.effectAllowed = "move"; card.classList.add("dragging"); });
    card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
    card.addEventListener("click", function(e){ if (!e.target.closest("a,select,button")) openCard(l.id); });

    var name = el("button", "card-name", l.name); name.type = "button";
    name.addEventListener("click", function(){ openCard(l.id); });
    var phone = contactLink(l, "card-phone");
    var meta = el("div", "card-meta");
    var src = el("span", "src", l.source); src.dataset.src = l.source;
    meta.appendChild(src);
    meta.appendChild(el("span", null, "#" + l.id + " · " + fmt(l.created_at)));
    var sel = el("select", "stage"); sel.setAttribute("aria-label", "Этап: " + l.name);
    fillStages(sel, l.status);
    sel.addEventListener("change", function(){ sel.disabled = true; move(l, sel.value); });

    card.appendChild(name); card.appendChild(phone);
    if (l.consultation_at) card.appendChild(el("div", "card-when", "Консультация: " + fmt(l.consultation_at)));
    card.appendChild(meta); card.appendChild(sel);
    return card;
  }

  function move(lead, stage){
    msg("panel-msg", "");
    setStage(lead.id, stage).then(load).catch(function(e){
      if (e.message !== "unauthorized") { msg("panel-msg", e.message); renderBoard(); }
    });
  }

  function load(){
    return api("/api/leads").then(function(data){
      leads = data; renderBoard(); stamp();
    }).catch(function(e){ if (e.message !== "unauthorized") msg("panel-msg", e.message); });
  }

  // ---------- Карточка клиента ----------
  function openCard(id){
    current = id;
    msg("d-msg", ""); $("d-content").hidden = true; $("d-title").textContent = "Загружаю…";
    if (!$("card-dlg").open) $("card-dlg").showModal();
    loadCard(id, true).catch(function(e){ if (e.message !== "unauthorized") msg("d-msg", e.message); });
  }

  // withNotes = false — не трогать заметки, чтобы не стереть несохранённый текст при смене этапа
  function loadCard(id, withNotes){
    return api("/api/leads?id=" + id).then(function(lead){
      if (current !== id) return;
      renderDetail(lead, withNotes);
      $("d-content").hidden = false;
    });
  }

  function renderDetail(lead, withNotes){
    $("d-title").textContent = lead.name;
    var info = $("d-info"); info.textContent = "";
    function row(k, v, href){
      info.appendChild(el("dt", null, k));
      var dd = el("dd");
      if (href) { var a = el("a", null, v); a.href = href; dd.appendChild(a); } else dd.textContent = v;
      info.appendChild(dd);
    }
    if (lead.phone) row("Телефон", lead.phone, tel(lead.phone)); else row("Телефон", "не указан");
    if (lead.telegram_username) row("Telegram", "@" + lead.telegram_username, tgUrl(lead.telegram_username));
    else if (lead.telegram_id) row("Telegram", "ID " + lead.telegram_id + " (без username)");
    if (lead.consultation_at) row("Консультация", fmt(lead.consultation_at));
    row("Источник", lead.source);
    row("Создан", fmt(lead.created_at));
    if (lead.age) row("Возраст", String(lead.age));
    if (lead.topic) row("Тема", lead.topic);
    if (lead.comment) row("Комментарий с сайта", lead.comment);

    fillStages($("d-stage"), lead.status);
    if (withNotes) { $("d-notes").value = lead.notes || ""; $("d-saved").textContent = ""; }

    var h = $("d-history"); h.textContent = "";
    if (!lead.history.length) h.appendChild(el("li", "muted", "Записей нет"));
    lead.history.forEach(function(x){
      var li = el("li");
      li.appendChild(el("time", null, fmt(x.changed_at)));
      li.appendChild(el("span", null, x.from_stage ? x.from_stage + " → " + x.to_stage : "Создан · " + x.to_stage));
      if (x.note) li.appendChild(el("small", null, x.note));
      h.appendChild(li);
    });
  }

  $("d-stage").addEventListener("change", function(){
    var sel = this, id = current; sel.disabled = true; msg("d-msg", "");
    setStage(id, sel.value)
      .then(function(){ load(); })
      .catch(function(e){ if (e.message !== "unauthorized") msg("d-msg", e.message); })
      .then(function(){ if (current === id) return loadCard(id, false); })
      .catch(function(){})
      .then(function(){ sel.disabled = false; });
  });

  $("d-save").addEventListener("click", function(){
    var btn = this, id = current; btn.disabled = true; msg("d-msg", ""); $("d-saved").textContent = "";
    api("/api/leads", {method:"PATCH", body: JSON.stringify({id:id, notes:$("d-notes").value})})
      .then(function(){ $("d-saved").textContent = "Сохранено"; load(); })
      .catch(function(e){ if (e.message !== "unauthorized") msg("d-msg", e.message); })
      .then(function(){ btn.disabled = false; });
  });

  $("card-dlg").addEventListener("close", function(){ current = null; });

  // ---------- Новый клиент ----------
  $("add").addEventListener("click", function(){
    $("add-form").reset(); msg("a-msg", "");
    $("add-dlg").showModal(); $("a-name").focus();
  });

  $("add-form").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("a-name").value.trim(), phone = $("a-phone").value.trim();
    var err = !name ? "Укажите имя клиента."
      : phone.replace(/\D/g, "").length < 6 ? "Проверьте номер телефона: в нём должно быть хотя бы 6 цифр." : "";
    if (err) { msg("a-msg", err); return; }
    var btn = $("a-save"); btn.disabled = true; msg("a-msg", "");
    api("/api/leads", {method:"POST", body: JSON.stringify({name:name, phone:phone, notes:$("a-notes").value})})
      .then(function(){ $("add-dlg").close(); load(); })
      .catch(function(e){ if (e.message !== "unauthorized") msg("a-msg", e.message); })
      .then(function(){ btn.disabled = false; });
  });

  document.querySelectorAll("[data-close]").forEach(function(b){
    b.addEventListener("click", function(){ b.closest("dialog").close(); });
  });

  // ---------- Расходы ----------
  // Категории. Тот же список — в api/_lib.js и в check-ограничении expenses (supabase.sql)
  var CATEGORIES = ["Реклама", "Печать материалов", "Консультанты", "Сервисы и подписки", "Прочее"];
  var MAX_FILE = 3 * 1024 * 1024; // как MAX_FILE_BYTES в api/_lib.js: после base64 укладывается в лимит Vercel 4,5 МБ
  var MAX_SIDE = 2000;            // фото уменьшаем до 2000 px по длинной стороне — текст чека остаётся читаемым
  var month = chisinauToday().slice(0, 7), pending = null, scanSeq = 0;

  function chisinauToday(){
    var p = {};
    new Intl.DateTimeFormat("en-US", {timeZone:"Europe/Chisinau", year:"numeric", month:"2-digit", day:"2-digit"})
      .formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
    return p.year + "-" + p.month + "-" + p.day;
  }
  function monthLabel(m){
    var s = new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1, 1)).toLocaleDateString("ru-RU", {month:"long", year:"numeric", timeZone:"UTC"});
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function shiftMonth(delta){
    var y = +month.slice(0, 4), m = +month.slice(5, 7) + delta;
    if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
    month = y + "-" + (m < 10 ? "0" : "") + m;
    loadExpenses();
  }
  function money(n, cur){ return Number(n).toLocaleString("ru-RU", {minimumFractionDigits:2, maximumFractionDigits:2}) + " " + cur; }
  function fmtDate(d){ return d.slice(8, 10) + "." + d.slice(5, 7) + "." + d.slice(0, 4); }
  function trow(label, value){ var r = el("div", "trow"); r.appendChild(el("span", null, label)); r.appendChild(el("span", null, value)); return r; }

  function loadExpenses(){
    var m = month;
    $("m-label").textContent = monthLabel(m);
    return api("/api/expenses?month=" + m).then(function(data){
      if (m !== month) return; // пока грузилось, месяц уже переключили
      renderExpenses(data); stamp();
    }).catch(function(e){ if (e.message !== "unauthorized") msg("panel-msg", e.message); });
  }

  function renderExpenses(data){
    var tot = $("exp-totals"), list = $("exp-list");
    tot.textContent = ""; list.textContent = "";

    // Итоги отдельно по каждой валюте; если расходов нет — нули в леях
    var totals = data.totals.length ? data.totals
      : [{currency:"MDL", total:0, categories: CATEGORIES.map(function(c){ return {category:c, amount:0}; })}];
    totals.forEach(function(t){
      var card = el("section", "total-card");
      card.appendChild(el("h2", null, "Итоги за " + monthLabel(month).toLowerCase() + " · " + t.currency));
      t.categories.forEach(function(c){ card.appendChild(trow(c.category, money(c.amount, t.currency))); });
      var sum = trow("Итого за месяц", money(t.total, t.currency)); sum.className += " sum";
      card.appendChild(sum);
      tot.appendChild(card);
    });

    if (!data.items.length) {
      list.appendChild(el("div", "empty", "За " + monthLabel(month).toLowerCase() + " расходов нет. Нажмите «Добавить чек»."));
      return;
    }
    data.items.forEach(function(x){
      var row = el("article", "exp");
      row.appendChild(el("span", "exp-date", fmtDate(x.expense_date)));
      var main = el("div", "exp-main");
      main.appendChild(el("div", "exp-vendor", x.vendor || "Продавец не указан"));
      main.appendChild(el("span", "src", x.category));
      row.appendChild(main);
      row.appendChild(el("span", "exp-amount", money(x.amount, x.currency)));
      var b = el("button", "btn btn-sm", x.file_type === "application/pdf" ? "Оригинал (PDF)" : "Оригинал"); b.type = "button";
      b.addEventListener("click", function(){ openOriginal(x.id, b); });
      row.appendChild(b);
      list.appendChild(row);
    });
  }

  // Оригинал открывается по временной ссылке (5 минут). Вкладку открываем сразу по клику,
  // иначе браузер заблокирует её как всплывающее окно, а адрес подставляем, когда он придёт.
  function openOriginal(id, btn){
    var w = window.open("", "_blank");
    btn.disabled = true; msg("panel-msg", "");
    api("/api/expenses?file=" + id).then(function(d){
      if (w) { w.opener = null; w.location.href = d.url; } else location.href = d.url;
    }).catch(function(e){
      if (w) w.close();
      if (e.message !== "unauthorized") msg("panel-msg", e.message);
    }).then(function(){ btn.disabled = false; });
  }

  // ---------- Подготовка файла в браузере ----------
  function readDataUrl(blob){
    return new Promise(function(ok, fail){
      var r = new FileReader();
      r.onload = function(){ ok(r.result); };
      r.onerror = function(){ fail(new Error("Не удалось прочитать файл.")); };
      r.readAsDataURL(blob);
    });
  }
  function loadImage(file){
    return new Promise(function(ok, fail){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){ URL.revokeObjectURL(url); ok(img); };
      img.onerror = function(){ URL.revokeObjectURL(url); fail(new Error("Не удалось открыть фото. Сохраните его как JPEG или сфотографируйте чек заново.")); };
      img.src = url;
    });
  }
  // Уменьшаем фото и сохраняем в JPEG, чтобы запрос уложился в лимит Vercel 4,5 МБ
  function compress(img){
    var scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    var c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); // прозрачный PNG не станет чёрным
    ctx.drawImage(img, 0, 0, c.width, c.height);
    function toBlob(q){
      return new Promise(function(ok, fail){ c.toBlob(function(b){ b ? ok(b) : fail(new Error("Не удалось сжать фото.")); }, "image/jpeg", q); });
    }
    return toBlob(0.85).then(function(b){ return b.size > 2.5 * 1024 * 1024 ? toBlob(0.6) : b; }).then(function(b){
      if (b.size > MAX_FILE) throw new Error("Фото слишком большое даже после сжатия. Сфотографируйте чек ещё раз.");
      return b;
    });
  }
  // Результат: {type, data (base64 без префикса), preview (адрес для превью)}
  function prepareFile(f){
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
      if (f.size > MAX_FILE) return Promise.reject(new Error("PDF больше 3 МБ. Сохраните его меньшего размера или сфотографируйте чек."));
      return readDataUrl(f).then(function(url){ return {type:"application/pdf", data:url.split(",")[1], preview:URL.createObjectURL(f)}; });
    }
    if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)) {
      return Promise.reject(new Error("Подходят только фото или PDF."));
    }
    return loadImage(f).then(compress).then(function(blob){
      return readDataUrl(blob).then(function(url){ return {type:"image/jpeg", data:url.split(",")[1], preview:URL.createObjectURL(blob)}; });
    });
  }

  // ---------- Распознавание и экран проверки ----------
  function startReview(file){
    pending = file;
    var seq = ++scanSeq;
    var pv = $("e-preview"); pv.textContent = "";
    if (file.type === "application/pdf") {
      var fr = el("iframe"); fr.src = file.preview; fr.title = "Превью PDF"; pv.appendChild(fr);
      var a = el("a", null, "Открыть PDF в новой вкладке"); a.href = file.preview; a.target = "_blank"; a.rel = "noopener"; pv.appendChild(a);
    } else {
      var im = el("img"); im.src = file.preview; im.alt = "Фото чека"; pv.appendChild(im);
    }
    $("exp-form").reset();
    $("e-fields").disabled = true; $("e-fields").hidden = false;
    $("e-save").disabled = true; $("e-save").hidden = false;
    msg("e-msg", ""); $("e-status").textContent = "Распознаю чек… Обычно это 5–20 секунд, если сервис перегружен — до минуты.";
    if (!$("exp-dlg").open) $("exp-dlg").showModal();

    api("/api/expense-scan", {method:"POST", body: JSON.stringify({file:file.data, type:file.type})})
      .then(function(r){
        if (seq !== scanSeq) return; // окно уже закрыли
        $("e-amount").value = r.amount != null ? String(r.amount).replace(".", ",") : "";
        $("e-currency").value = r.currency || "MDL";
        $("e-date").value = r.date || "";
        $("e-vendor").value = r.vendor || "";
        $("e-category").value = r.category;
        $("e-status").textContent = (r.amount == null || !r.date)
          ? "Не все поля удалось прочитать — заполните пустые и проверьте остальные."
          : "Проверьте поля по фото и при необходимости поправьте.";
        $("e-fields").disabled = false; $("e-save").disabled = false;
        $("e-amount").focus();
      })
      .catch(function(e){
        if (seq !== scanSeq || e.message === "unauthorized") return;
        // Не чек, лимит Gemini или ошибка — показываем причину, сохранять нечего
        $("e-status").textContent = "";
        $("e-fields").hidden = true; $("e-save").hidden = true;
        msg("e-msg", e.message);
      });
  }

  CATEGORIES.forEach(function(c){ var o = el("option", null, c); o.value = c; $("e-category").appendChild(o); });

  $("exp-form").addEventListener("submit", function(e){
    e.preventDefault();
    if (!pending) return;
    var amount = $("e-amount").value.replace(/\s/g, "").replace(",", ".");
    var currency = $("e-currency").value.trim().toUpperCase();
    var date = $("e-date").value;
    var err = !(Number(amount) > 0) ? "Укажите сумму больше нуля."
      : !/^[A-Z]{3}$/.test(currency) ? "Валюта — три латинские буквы, например MDL или EUR."
      : !date ? "Укажите дату чека." : "";
    if (err) { msg("e-msg", err); return; }

    var btn = $("e-save"), file = pending;
    btn.disabled = true; msg("e-msg", ""); $("e-status").textContent = "Сохраняю…";
    api("/api/expenses", {method:"POST", body: JSON.stringify({
      file:file.data, type:file.type, amount:amount, currency:currency, date:date,
      vendor:$("e-vendor").value, category:$("e-category").value
    })}).then(function(row){
      month = row.expense_date.slice(0, 7); // показываем месяц, в который попал расход
      $("exp-dlg").close();
      loadExpenses();
    }).catch(function(e){
      if (e.message === "unauthorized") return;
      $("e-status").textContent = ""; msg("e-msg", e.message); btn.disabled = false;
    });
  });

  // «Отмена», крестик или Esc: ничего не сохраняем, освобождаем превью
  $("exp-dlg").addEventListener("close", function(){
    scanSeq++;
    if (pending) { URL.revokeObjectURL(pending.preview); pending = null; }
    $("e-preview").textContent = "";
  });

  $("exp-add").addEventListener("click", function(){ $("exp-file").value = ""; $("exp-file").click(); });
  $("exp-file").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if (!f) return;
    msg("panel-msg", "");
    prepareFile(f).then(startReview).catch(function(e){ msg("panel-msg", e.message); });
  });
  $("m-prev").addEventListener("click", function(){ shiftMonth(-1); });
  $("m-next").addEventListener("click", function(){ shiftMonth(1); });

  // ---------- Вкладки ----------
  var tab = "clients";
  function setTab(name){
    tab = name;
    $("tab-clients").setAttribute("aria-selected", String(name === "clients"));
    $("tab-expenses").setAttribute("aria-selected", String(name === "expenses"));
    $("clients-view").hidden = name !== "clients";
    $("expenses-view").hidden = name !== "expenses";
    try { history.replaceState(null, "", name === "expenses" ? "#expenses" : location.pathname); } catch(e){}
    msg("panel-msg", "");
    return name === "expenses" ? loadExpenses() : load();
  }
  $("tab-clients").addEventListener("click", function(){ setTab("clients"); });
  $("tab-expenses").addEventListener("click", function(){ setTab("expenses"); });

  // ---------- Вход ----------
  function openPanel(){
    $("login").hidden = true; $("panel").hidden = false;
    setTab(location.hash === "#expenses" ? "expenses" : "clients");
  }

  $("login").addEventListener("submit", function(e){
    e.preventDefault();
    var btn = $("login-btn"); btn.disabled = true; $("login-msg").hidden = true;
    fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password: $("pw").value})})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if (!r.ok) throw new Error(d.error || "Не удалось войти"); return d; }); })
      .then(function(d){ saveToken(d.token); $("pw").value = ""; openPanel(); })
      .catch(function(err){ $("login-msg").textContent = err.message; $("login-msg").hidden = false; })
      .then(function(){ btn.disabled = false; });
  });
  $("logout").addEventListener("click", function(){ showLogin(""); });
  $("refresh").addEventListener("click", function(){ msg("panel-msg", ""); tab === "expenses" ? loadExpenses() : load(); });

  token ? openPanel() : showLogin("");
})();
</script>
</body>
